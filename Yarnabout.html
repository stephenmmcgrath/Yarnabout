<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DingoLingo — Learn a Language, Have a Yarn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@500;700&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+Egyptian+Hieroglyphs&family=Noto+Sans+KR:wght@500;700&family=Noto+Sans+Cuneiform&family=Noto+Sans+Gurmukhi:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#171923;
    --bg-elev:#1F2333;
    --bg-elev-2:#272C40;
    --text:#F3EDE0;
    --text-dim:#A9A6B0;
    --thread:#E8DCC0;
    --mandarin:#E14848;
    --spanish:#F0A93C;
    --arabic:#2FB6A6;
    --maori:#6FBF73;
    --yolngu:#C97A3D;
    --russian:#4E7FD6;
    --indonesian:#D9483C;
    --french:#3D6DB5;
    --swahili:#2E8B57;
    --hieroglyphs:#C9A227;
    --korean:#8E44AD;
    --irish:#3D9970;
    --turkish:#C0392B;
    --zulu:#D4A017;
    --icelandic:#4A90A4;
    --afrikaans:#E07A3E;
    --sumerian:#B08D57;
    --samoan:#0072B5;
    --punjabi:#D2691E;
    --nepali:#8B0000;
    --latin:#8A7256;
    --navajo:#A65B3E;
    --greek:#1E88C7;
    --japanese:#BC002D;
    --good:#5FD97E;
    --bad:#F0665C;
    --radius:18px;
    --radius-sm:12px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 15% 0%, rgba(232,220,192,0.05), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(47,182,166,0.06), transparent 45%),
      var(--bg);
  }
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  #app{max-width:1400px;margin:0 auto;padding: clamp(16px, 3vw, 40px);min-height:100dvh;display:flex;flex-direction:column;}

  /* ---- Yarn thread signature element ---- */
  .yarn-trail{width:100%;overflow:visible;display:block;margin: 8px 0 24px;}
  .yarn-dot{transition:r .3s ease, fill .3s ease;}
  .stitch{border:none;border-top:3px dashed rgba(232,220,192,0.25);margin:20px 0;}

  /* ---- Header ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .applogo{width: clamp(40px,5.2vw,56px); height: clamp(40px,5.2vw,56px); display:block; border-radius: 14px; object-fit: cover; box-shadow: var(--shadow);}
  .brand h1{font-size: clamp(26px, 4vw, 44px); margin:0; letter-spacing:.5px;}
  .brand small{color:var(--text-dim); display:block; font-size:.85em; font-weight:500;}
  .playerchip{display:flex;align-items:center;gap:8px;background:var(--bg-elev);border:1px solid rgba(255,255,255,0.06);padding:8px 14px;border-radius:999px;font-weight:600;font-size:clamp(13px,1.4vw,16px);}
  .playerchip .dot{width:10px;height:10px;border-radius:50%;background:var(--thread);}

  /* ---- Screens ---- */
  .screen{flex:1;display:flex;flex-direction:column;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .subtitle{color:var(--text-dim);font-size:clamp(14px,1.6vw,18px);margin: 0 0 24px;max-width:60ch;}

  /* ---- Cards / grids ---- */
  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
  .card{
    background:var(--bg-elev);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:10px;
    position:relative;overflow:hidden;
    transition:transform .18s ease, border-color .18s ease;
  }
  .card.clickable{cursor:pointer;}
  .card.clickable:hover, .card.clickable:focus-visible{transform:translateY(-4px);border-color: var(--accent, var(--thread));outline:none;}
  .card .icon{font-size:clamp(30px,3.4vw,40px);}
  .card h3{margin:0;font-size:clamp(18px,2vw,24px);}
  .card p{margin:0;color:var(--text-dim);font-size:clamp(13px,1.4vw,15px);}
  .card .bar{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent, var(--thread));}
  .card.locked{opacity:.45;filter:grayscale(.4);cursor:not-allowed;}
  .badge{align-self:flex-start;font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,0.08);padding:3px 9px;border-radius:999px;color:var(--text-dim);}

  /* ---- Buttons ---- */
  .btn{
    border:none;border-radius:999px;padding: 12px 24px;font-weight:700;font-size:clamp(14px,1.6vw,17px);
    background:var(--bg-elev-2);color:var(--text);border:1px solid rgba(255,255,255,0.08);
    transition:transform .12s ease, background .12s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:linear-gradient(135deg, var(--accent,var(--thread)), color-mix(in srgb, var(--accent,var(--thread)) 70%, white));color:#171923;}
  .btn.ghost{background:transparent;}
  .btn.big{padding:18px 30px;font-size:clamp(16px,2vw,20px);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .row.between{justify-content:space-between;}
  .spacer{flex:1;}

  input[type=text]{
    background:var(--bg-elev-2);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius-sm);
    padding:12px 16px;color:var(--text);font-size:16px;width:100%;
  }
  input[type=text]:focus{outline:2px solid var(--thread);}

  /* ---- Flashcards ---- */
  .stage{display:flex;flex-direction:column;align-items:center;gap:22px;flex:1;justify-content:center;padding: 10px 0 30px;}
  .progressline{width:min(680px,90%);height:8px;background:var(--bg-elev-2);border-radius:999px;overflow:hidden;}
  .progressline > div{height:100%;background:var(--accent,var(--thread));transition:width .3s ease;}
  .flashcard{
    width:min(680px,94%);
    background:var(--bg-elev);border:1px solid rgba(255,255,255,0.08);border-radius:24px;
    padding: clamp(28px,5vw,56px) clamp(20px,5vw,50px);text-align:center;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:16px;align-items:center;
  }
  .target-word{font-family:'Noto Sans SC','Noto Sans KR','Noto Sans Arabic','Noto Sans Egyptian Hieroglyphs','Noto Sans Cuneiform','Noto Sans Gurmukhi','Noto Sans Devanagari','Noto Sans JP','Baloo 2',sans-serif;font-size:clamp(40px,8vw,84px);font-weight:700;line-height:1.1;}
  .target-word.rtl{direction:rtl;}
  .translit{color:var(--text-dim);font-size:clamp(14px,2vw,20px);letter-spacing:.03em;}
  .speak-btn{background:var(--accent,var(--thread));color:#171923;border:none;width:52px;height:52px;border-radius:50%;font-size:22px;box-shadow:var(--shadow);}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(680px,94%);}
  @media (max-width:520px){.choices{grid-template-columns:1fr;}}
  .choice{
    background:var(--bg-elev-2);border:2px solid rgba(255,255,255,0.08);border-radius:var(--radius-sm);
    padding:16px;font-size:clamp(15px,1.8vw,18px);font-weight:600;color:var(--text);text-align:left;
  }
  .choice:hover{border-color:var(--accent,var(--thread));}
  .choice.correct{background:rgba(95,217,126,0.18);border-color:var(--good);}
  .choice.wrong{background:rgba(240,102,92,0.18);border-color:var(--bad);}
  .feedback{min-height:28px;font-weight:700;font-size:clamp(15px,2vw,19px);}
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}

  /* ---- Phrases list ---- */
  .phraselist{display:flex;flex-direction:column;gap:12px;}
  .phrase{background:var(--bg-elev);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);padding:16px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .phrase .ptext{font-family:'Noto Sans SC','Noto Sans KR','Noto Sans Arabic','Noto Sans Egyptian Hieroglyphs','Noto Sans Cuneiform','Noto Sans Gurmukhi','Noto Sans Devanagari','Noto Sans JP','Baloo 2',sans-serif;font-size:clamp(18px,2.2vw,26px);font-weight:600;}
  .phrase .ptext.rtl{direction:rtl;}
  .phrase .ptranslit{color:var(--text-dim);font-size:.9em;}
  .phrase .pen{margin-left:auto;color:var(--text-dim);font-style:italic;}

  /* ---- Writing practice ---- */
  .writewrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .canvasbox{position:relative;width:min(360px,80vw);height:min(360px,80vw);background:var(--bg-elev);border:2px solid rgba(255,255,255,0.1);border-radius:var(--radius);box-shadow:var(--shadow);}
  .canvasbox .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(260px,60vw);font-family:'Noto Sans SC','Noto Sans KR','Noto Sans Arabic','Noto Sans Egyptian Hieroglyphs','Noto Sans Cuneiform','Noto Sans Gurmukhi','Noto Sans Devanagari','Noto Sans JP',sans-serif;color:rgba(255,255,255,0.08);user-select:none;pointer-events:none;}
  .canvasbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .writemeta{text-align:center;}
  .writemeta .lbl{font-size:clamp(28px,4vw,40px);font-weight:700;font-family:'Noto Sans SC','Noto Sans KR','Noto Sans Arabic','Noto Sans Egyptian Hieroglyphs','Noto Sans Cuneiform','Noto Sans Gurmukhi','Noto Sans Devanagari','Noto Sans JP',sans-serif;}
  .writemeta .name{color:var(--text-dim);}

  /* ---- Culture ---- */
  .culturecard{background:var(--bg-elev);border-radius:var(--radius);padding:30px;max-width:680px;margin:0 auto;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,0.06);}
  .culturecard h3{margin-top:0;}

  /* ---- Scoreboard ---- */
  table.scores{width:100%;border-collapse:collapse;}
  table.scores th, table.scores td{text-align:left;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.06);}
  table.scores th{color:var(--text-dim);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;}

  footer.hint{margin-top:auto;padding-top:24px;color:var(--text-dim);font-size:12px;text-align:center;}

  /* ---- TV / big-screen mode: scale everything up on wide, high-res displays ---- */
  @media (min-width: 1600px){
    body{font-size:19px;}
    .btn{padding:18px 32px;}
  }
</style>
</head>

    culture:[
      {title:"Silent letters are the rule, not the exception", body:"French drops most final consonants in speech — 'petit' is said more like 'puh-TEE' than 'puh-TEET'. Getting comfortable ignoring letters on the page is half the battle of pronunciation."},
      {title:"Every noun has a gender", body:"Le café (masculine), la table (feminine) — grammatical gender doesn't reliably track meaning and has to be learned alongside each noun, which is why French dictionaries always list le/la with new words."},
      {title:"70, 80 and 90 are doing arithmetic", body:"Standard French counts 70 as 'soixante-dix' (sixty-ten), 80 as 'quatre-vingts' (four-twenties) and 90 as 'quatre-vingt-dix' (four-twenty-ten) — a leftover from an old base-20 counting system. Belgian and Swiss French use simpler forms instead."},
      {title:"Liaison links words together", body:"When one word ends in a normally-silent consonant and the next starts with a vowel, that consonant often gets pronounced to link them smoothly — 'les amis' sounds like 'lay-za-MEE', not 'lay ah-MEE'."},
      {title:"Café culture runs deep", body:"Sitting at a café for hours over a single coffee, watching the street, is a genuine cultural institution in France — cafés have historically doubled as meeting places for writers, philosophers and political movements."}

      {title:"This isn't a spoken-language deck like the others", body:"Ancient Egyptian died out as a spoken language over a thousand years ago, and nobody knows exactly how it sounded. What you hear here is 'Egyptological pronunciation' — a scholarly convention (inserting a short 'e' between consonants) used so Egyptologists can talk about words out loud, not a reconstruction of the real ancient sound."},
      {title:"Verified sign by sign", body:"Every glyph, transliteration and meaning here was checked directly against the official Unicode Egyptian Hieroglyphs code chart and Gardiner's sign list — the standard reference Egyptologists actually use — rather than guessed."},
      {title:"24 sounds, thousands of signs", body:"Alongside logograms (whole-word picture signs) and determinatives (silent meaning-clarifiers), Egyptian had a set of roughly 24 single-consonant signs — shown here — that function like an alphabet. Ancient scribes mixed all three sign types freely within the same word."},
      {title:"No vowels written down", body:"Hieroglyphic writing recorded consonants, not vowels — which is exactly why nobody can be fully certain how Egyptian words were actually pronounced, and why 'Tutankhamun' and similar names are modern reconstructions filled in by convention."},
      {title:"Decoded via the Rosetta Stone", body:"Hieroglyphs were unreadable for over 1,400 years until the 1799 discovery of the Rosetta Stone, which repeated the same royal decree in hieroglyphic, Demotic and Greek — giving Jean-François Champollion the key to crack the script in 1822."}

      {title:"Everyone gets a year older on New Year's Day", body:"Under the traditional Korean age system, a baby is considered 1 year old at birth, and everyone's age ticks up together on New Year's Day rather than on individual birthdays — South Korea officially switched to international age in 2023 for most legal purposes, but the traditional system still comes up in daily life."},

      {title:"South Africa's most widely spoken home language", body:"Zulu (isiZulu) is spoken as a first language by more people than any other of South Africa's 12 official languages — around a quarter of the population — and is widely understood well beyond its home province of KwaZulu-Natal."},
      {title:"Nouns carry the grammar", body:"Zulu nouns take class prefixes (like umu-, aba-, ama-, isi-) that determine how every adjective, verb and pronoun referring to them is built — which is why the words here are shown in simplified dictionary forms rather than the fuller forms you'd hear in an actual sentence."},
      {title:"Click consonants exist, but they're not the main event", body:"Zulu borrowed click sounds from neighbouring Khoisan languages (they're far more central to Xhosa), so you'll hear them in specific words, but the bulk of everyday Zulu speech doesn't rely on clicks the way some people expect."},
      {title:"Ubuntu", body:"The philosophy of ubuntu — roughly 'I am because we are' — is closely associated with Zulu and other Nguni cultures, emphasising community, shared humanity and mutual care over individual achievement."},

    culture:[
      {title:"The world's first writing", body:"Sumerian cuneiform, developed around 3200 BCE in the city of Uruk, is the earliest writing system known — and it wasn't invented for literature or religion, but for tracking grain, livestock and temple accounts."},
      {title:"Wedge-shaped by necessity", body:"'Cuneiform' comes from the Latin for 'wedge-shaped' — scribes pressed a cut reed stylus into soft clay tablets, and the wedge shape is simply what that stylus naturally produces, unlike the flowing curves of a pen or brush."},
      {title:"Why we have 60 minutes in an hour", body:"Sumerian mathematics used a base-60 (sexagesimal) counting system rather than base-10. That's the direct reason we still divide hours into 60 minutes, minutes into 60 seconds, and circles into 360 degrees today."},
      {title:"A language with no relatives", body:"Unlike almost every other ancient language, Sumerian is a language isolate — it has no known living or extinct relatives, and its origins remain a genuine mystery to linguists."},
      {title:"The script outlived the language by millennia", body:"Sumerian died out as an everyday spoken language by around 2000 BCE, but scribes kept using it for scholarship and religion for another 2,000 years — and the cuneiform script itself was borrowed to write completely unrelated languages like Akkadian, Hittite and Elamite, staying in active use until roughly the 1st century CE."}
    ]

      {title:"Fa'a Sāmoa — 'the Samoan way'", body:"Fa'a Sāmoa is the broader cultural and social system — encompassing respect, family obligation, communal life and the matai (chief) system — that shapes how Samoans speak and act, not just a set of customs on the side."},
      {title:"Two registers of speech", body:"Samoan has a distinct polite/respectful vocabulary used with chiefs, elders and in formal settings, alongside everyday colloquial speech — similar in spirit to honorific systems in languages like Korean or Japanese, but built around the matai system specifically."},
      {title:"The glottal stop is a real letter", body:"The 'okina (ʻ) marks a glottal stop and is a distinct sound, not decoration — 'aʻoga' (school) and 'aoga' (useful) are different words because of it, much like the macron over a vowel changes meaning too."},
      {title:"The matai system", body:"Matai (chiefs) hold titles bestowed by their extended family (aiga) and play a central role in Samoan village governance and ceremony — the concept comes up constantly in everyday conversation about family and community."},
      {title:"A major Pacific diaspora language", body:"Beyond Samoa and American Samoa, Samoan is widely spoken in New Zealand, Australia and parts of the US (especially Hawaii and California) — New Zealand in particular has a large Samoan-speaking community and offers Samoan-medium early childhood education."}

      {title:"One language, two scripts", body:"Punjabi is written in Gurmukhi in Indian Punjab (used throughout this deck) and in Shahmukhi — a Perso-Arabic script — in Pakistani Punjab, where more Punjabi speakers actually live. It's the same spoken language split across two completely different writing systems."},
      {title:"Gurmukhi and Sikh scripture", body:"Gurmukhi was standardised in the 16th century and is closely tied to Sikhism — the Guru Granth Sahib, Sikhism's central scripture, is written in Gurmukhi, and the script's development is traditionally credited to the second Sikh Guru, Guru Angad Dev."},

    culture:[
      {title:"The mother of the Romance languages", body:"French, Spanish, Italian, Portuguese and Romanian all descend directly from spoken (Vulgar) Latin — which is why so much vocabulary in this app's Spanish and French decks looks familiar once you know the Latin root."},
      {title:"Hiding inside English too", body:"Despite being a Germanic language at its core, roughly 60% of English vocabulary traces back to Latin — largely via Norman French after 1066, plus centuries of direct scholarly borrowing. Words like 'agenda', 'alibi' and 'veto' are just unchanged Latin."},
      {title:"The working language of science, law and the Church for centuries", body:"Long after Rome fell, Latin remained the shared language of European scholarship, law and Catholic liturgy — which is why species get Latin binomial names (like Homo sapiens) and why legal terms like 'habeas corpus' and 'pro bono' survive today."},
      {title:"No fixed words for yes and no", body:"Classical Latin didn't really have dedicated words for 'yes' and 'no' the way modern languages do — like Irish, a Roman more often answered a question by restating the verb. 'Ita' and 'non' (used here) are reasonable stand-ins, but they weren't the automatic reflex answer that 'yes' and 'no' are in English."},
      {title:"Still spoken today, technically", body:"Latin is the official language of Vatican City, and a genuine 'Living Latin' movement runs immersion programmes and conversational meetups worldwide — so it's a dead language in the sense that no country grows up speaking it natively, but not entirely extinct."}

const state = {

// ---- Persistence helpers ----
function loadLocal(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function saveLocal(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

async function ensurePlayersLoaded(){
  state.group = loadLocal("yarnabout_group", []);
  state.scores = loadLocal("yarnabout_scores", {});
  if(sb){
    try{
      const {data, error} = await sb.from('yarnabout_players').select('*').order('created_at');
      if(!error && data && data.length){
        state.group = data.map(r=>({id:r.id, name:r.name}));
        saveLocal("yarnabout_group", state.group);
      }
      const {data: scoreRows} = await sb.from('yarnabout_scores').select('*');
      if(scoreRows){
        const merged = {};
        scoreRows.forEach(r=>{
          merged[r.player_id] = merged[r.player_id] || {};
          merged[r.player_id][r.language] = {correct:r.correct, total:r.total};
        });
        state.scores = merged;
        saveLocal("yarnabout_scores", state.scores);
      }
    }catch(e){ console.warn("Supabase load failed, using local data", e); }
  }
}

async function addPlayer(name){
  const id = "p_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
  const player = {id, name};
  state.group.push(player);
  saveLocal("yarnabout_group", state.group);
  if(sb){
    try{ await sb.from('yarnabout_players').insert({id, name}); }catch(e){ console.warn("Supabase insert player failed", e); }
  }
  return player;
}

async function recordResult(playerId, langKey, gotCorrect){
  state.scores[playerId] = state.scores[playerId] || {};
  const cur = state.scores[playerId][langKey] || {correct:0,total:0};
  cur.total += 1;
  if(gotCorrect) cur.correct += 1;
  state.scores[playerId][langKey] = cur;
  saveLocal("yarnabout_scores", state.scores);
  if(sb){
    try{
      await sb.from('yarnabout_scores').upsert({
        player_id:playerId, language:langKey, correct:cur.correct, total:cur.total, updated_at:new Date().toISOString()
      }, {onConflict:'player_id,language'});
    }catch(e){ console.warn("Supabase score sync failed", e); }
  }
}

// ---- Speech ----
function speak(text, langCode){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = langCode;
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){ console.warn("TTS not available", e); }
}

// ---- Utility ----
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickN(arr, n){ return shuffle(arr).slice(0,n); }
function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else if(k.startsWith("on") && typeof v==="function") e.addEventListener(k.slice(2), v);
    else if(v!==undefined && v!==null) e.setAttribute(k,v);
  }
  children.flat().forEach(c=>{ if(c===null||c===undefined) return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}

function yarnTrail(activeIndex, total, accent){
  const w = 320, h = 30, gap = w/(total+1);
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("class","yarn-trail");
  svg.style.maxWidth = "360px";
  let d = `M ${gap} ${h/2} `;
  for(let i=1;i<total;i++){
    const x = gap*(i+1);
    const yOff = (i%2===0)? -8 : 8;
    d += `Q ${gap*i+gap/2} ${h/2+yOff} ${x} ${h/2} `;
  }
  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d", d);
  path.setAttribute("stroke","rgba(232,220,192,0.3)");
  path.setAttribute("stroke-width","2");
  path.setAttribute("stroke-dasharray","1 7");
  path.setAttribute("fill","none");
  svg.appendChild(path);
  for(let i=0;i<total;i++){
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", gap*(i+1)); c.setAttribute("cy", h/2);
    c.setAttribute("r", i<=activeIndex ? 7 : 5);
    c.setAttribute("class","yarn-dot");
    c.setAttribute("fill", i<=activeIndex ? accent : "rgba(255,255,255,0.15)");
    svg.appendChild(c);
  }
  return svg;
}

// ---- Screen: Players / Groups ----
function renderPlayersScreen(root){
  root.appendChild(el("h2",{}, "Who's playing tonight?"));
  root.appendChild(el("p",{class:"subtitle"}, "Add everyone in your group. Everyone's progress is tracked separately and synced to the cloud, so pick up on the phone right where you left off on the TV."));

  const grid = el("div",{class:"grid"});
  state.group.forEach(p=>{
    grid.appendChild(el("div",{class:"card clickable", tabindex:"0", onclick:()=>{ state.activePlayer=p; state.screen="home"; render(); }},
      el("div",{class:"icon"}, "🙋"),
      el("h3",{}, p.name),
      el("p",{}, "Tap to play as " + p.name)
    ));
  });

  const addCard = el("div",{class:"card"},
    el("div",{class:"icon"}, "➕"),
    el("h3",{}, "Add a player"),
    el("div",{class:"row"},
      (()=>{ const i = el("input",{type:"text", placeholder:"Name"}); i.id="newPlayerInput"; return i; })(),
    ),
    el("button",{class:"btn primary", onclick: async ()=>{
      const input = document.getElementById("newPlayerInput");
      const name = input.value.trim();
      if(!name) return;
      const p = await addPlayer(name);
      state.activePlayer = p;
      state.screen = "home";
      render();
    }}, "Add & play")
  );
  grid.appendChild(addCard);
  root.appendChild(grid);
}

// ---- Screen: Home (language select) ----
function renderHomeScreen(root){
  root.appendChild(el("h2",{}, "Pick a language"));
  const allLangs = Object.values(LANGUAGES);
  const readyCount = allLangs.filter(l=>l.available).length;
  const comingCount = allLangs.length - readyCount;
  const subtitle = comingCount > 0
    ? `${readyCount} languages ready to go, ${comingCount} more brewing.`
    : `${readyCount} languages ready to go.`;
  root.appendChild(el("p",{class:"subtitle"}, subtitle));
  const grid = el("div",{class:"grid"});
  Object.values(LANGUAGES).forEach(lang=>{
    const card = el("div",{
      class:"card clickable" + (lang.available ? "" : " locked"),
      style:`--accent:${lang.accent}`,
      tabindex: lang.available ? "0" : "-1",
      onclick: lang.available ? ()=>{ state.language=lang.key; state.screen="level"; render(); } : null
    },
      el("div",{class:"bar"}),
      el("div",{class:"icon"}, lang.flag),
      el("h3",{}, lang.name + (lang.native? " · " + lang.native : "")),
      el("p",{}, lang.blurb),
      !lang.available ? el("span",{class:"badge"}, "Coming soon") : el("span",{class:"badge"}, lang.words.length + " words ready")
    );
    grid.appendChild(card);
  });
  root.appendChild(grid);
}

// ---- Screen: Level ----
function renderLevelScreen(root){
  const lang = LANGUAGES[state.language];
  root.appendChild(el("h2",{}, "Choose your level"));
  root.appendChild(el("p",{class:"subtitle"}, `${lang.flag} ${lang.name}`));
  const grid = el("div",{class:"grid"});
  Object.values(LEVELS).forEach(lvl=>{
    grid.appendChild(el("div",{
      class:"card clickable" + (lvl.available ? "" : " locked"),
      style:`--accent:${lang.accent}`,
      onclick: lvl.available ? ()=>{ state.level=lvl.key; state.screen="mode"; render(); } : null
    },
      el("div",{class:"bar"}),
      el("div",{class:"icon"}, lvl.key==="tourist" ? "🧳" : "💬"),
      el("h3",{}, lvl.name),
      el("p",{}, lvl.desc),
      !lvl.available ? el("span",{class:"badge"}, "Coming soon") : null
    ));
  });
  root.appendChild(grid);
  root.appendChild(el("button",{class:"btn ghost", onclick:()=>{ state.screen="home"; render(); }}, "← Back"));
}

// ---- Screen: Mode select ----
function renderModeScreen(root){
  const lang = LANGUAGES[state.language];
  root.appendChild(el("h2",{}, "How do you want to play?"));
  root.appendChild(el("p",{class:"subtitle"}, `${lang.flag} ${lang.name} · ${LEVELS[state.level].name}`));
  const modes = [
    {key:"flashcards", icon:"🎴", title:"Flashcards", desc:"Multiple choice, quick rounds", enabled: lang.words.length>0},
    {key:"phrases", icon:"💬", title:"Key Phrases", desc:"Everyday lines with audio", enabled: lang.phrases.length>0},
    {key:"writing", icon:"✍️", title:"Writing Practice", desc:"Trace characters & letters", enabled: lang.writing.length>0},
    {key:"culture", icon:"🌏", title:"Culture & History", desc:"Bite-size stories about the language", enabled: lang.culture.length>0},
    {key:"scoreboard", icon:"🏆", title:"Scoreboard", desc:"See how the whole group's going", enabled:true}
  ];
  const grid = el("div",{class:"grid"});
  modes.forEach(m=>{
    grid.appendChild(el("div",{
      class:"card clickable" + (m.enabled ? "" : " locked"),
      style:`--accent:${lang.accent}`,
      onclick: m.enabled ? ()=>{ state.mode=m.key; startMode(m.key); state.screen=m.key; render(); } : null
    },
      el("div",{class:"bar"}),
      el("div",{class:"icon"}, m.icon),
      el("h3",{}, m.title),
      el("p",{}, m.desc)
    ));
  });
  root.appendChild(grid);
  root.appendChild(el("button",{class:"btn ghost", onclick:()=>{ state.screen="level"; render(); }}, "← Back"));
}

function startMode(mode){
  const lang = LANGUAGES[state.language];
  if(mode==="flashcards"){
    state.session = {items: pickN(lang.words, Math.min(10, lang.words.length)), index:0, correct:0, total:0};
  } else if(mode==="phrases"){
    state.session = {items: lang.phrases, index:0, correct:0, total:0, revealed:{}};
  } else if(mode==="writing"){
    state.session = {items: lang.writing, index:0};
  } else if(mode==="culture"){
    state.session = {items: lang.culture, index:0};
  }
}

// ---- Screen: Flashcards ----
function renderFlashcardsScreen(root){
  const lang = LANGUAGES[state.language];
  const s = state.session;
  if(s.index >= s.items.length){
    root.appendChild(roundComplete(lang, s));
    return;
  }
  const item = s.items[s.index];
  root.appendChild(yarnTrail(s.index, s.items.length, lang.accent));
  const stage = el("div",{class:"stage"});
  const prog = el("div",{class:"progressline"}, el("div",{style:`width:${(s.index/s.items.length)*100}%; background:${lang.accent}`}));
  stage.appendChild(prog);

  const card = el("div",{class:"flashcard"},
    el("div",{class:"target-word" + (lang.rtl?" rtl":"")}, item.t),
    lang.script ? el("div",{class:"translit"}, item.p) : null,
    el("button",{class:"speak-btn", style:`background:${lang.accent}`, onclick:()=>speak(item.t, lang.speechLang)}, "🔊")
  );
  stage.appendChild(card);

  const correctEn = item.en;
  const distractors = pickN(lang.words.filter(w=>w.en!==correctEn).map(w=>w.en), 3);
  const options = shuffle([correctEn, ...distractors]);
  const choicesWrap = el("div",{class:"choices"});
  const feedback = el("div",{class:"feedback"});

  options.forEach(opt=>{
    const btn = el("button",{class:"choice", onclick:()=>{
      const isCorrect = opt===correctEn;
      Array.from(choicesWrap.children).forEach(c=>c.disabled=true);
      btn.classList.add(isCorrect?"correct":"wrong");
      if(!isCorrect){
        Array.from(choicesWrap.children).find(c=>c.textContent===correctEn)?.classList.add("correct");
      }
      feedback.textContent = isCorrect ? "Nice one! 🎉" : `Close — it means "${correctEn}"`;
      feedback.className = "feedback " + (isCorrect?"good":"bad");
      s.total++; if(isCorrect) s.correct++;
      if(state.activePlayer) recordResult(state.activePlayer.id, lang.key, isCorrect);
      setTimeout(()=>{ s.index++; render(); }, 1100);
    }}, opt);
    choicesWrap.appendChild(btn);
  });
  stage.appendChild(choicesWrap);
  stage.appendChild(feedback);
  root.appendChild(stage);
}

function roundComplete(lang, s){
  const wrap = el("div",{class:"stage"});
  wrap.appendChild(el("div",{class:"flashcard"},
    el("div",{style:"font-size:48px;"}, "🐾"),
    el("h2",{}, "Round done!"),
    el("p",{}, `${s.correct} / ${s.items.length} correct — bonzer effort.`),
    el("div",{class:"row"},
      el("button",{class:"btn primary", style:`--accent:${lang.accent}`, onclick:()=>{ startMode("flashcards"); render(); }}, "Play again"),
      el("button",{class:"btn ghost", onclick:()=>{ state.screen="mode"; render(); }}, "Change mode")
    )
  ));
  return wrap;
}

// ---- Screen: Phrases ----
function renderPhrasesScreen(root){
  const lang = LANGUAGES[state.language];
  root.appendChild(el("h2",{}, "Key phrases"));
  root.appendChild(el("p",{class:"subtitle"}, "Tap 🔊 to hear it, tap the card to reveal the meaning."));
  const list = el("div",{class:"phraselist"});
  lang.phrases.forEach((ph, i)=>{
    const revealed = state.session.revealed[i];
    const row = el("div",{class:"phrase", onclick:(e)=>{ if(e.target.tagName==="BUTTON") return; state.session.revealed[i]=!revealed; render(); }},
      el("button",{class:"speak-btn", style:`background:${lang.accent};width:40px;height:40px;font-size:16px;`, onclick:(e)=>{e.stopPropagation(); speak(ph.t, lang.speechLang);}}, "🔊"),
      el("div",{},
        el("div",{class:"ptext"+(lang.rtl?" rtl":"")}, ph.t),
        lang.script ? el("div",{class:"ptranslit"}, ph.p) : null
      ),
      el("div",{class:"pen"}, revealed ? ph.en : "tap to reveal")
    );
    list.appendChild(row);
  });
  root.appendChild(list);
  root.appendChild(el("hr",{class:"stitch"}));
  root.appendChild(el("button",{class:"btn ghost", onclick:()=>{ state.screen="mode"; render(); }}, "← Back to modes"));
}

// ---- Screen: Writing practice ----
function renderWritingScreen(root){
  const lang = LANGUAGES[state.language];
  const s = state.session;
  const item = s.items[s.index % s.items.length];
  root.appendChild(el("h2",{}, "Writing practice"));
  root.appendChild(el("p",{class:"subtitle"}, lang.rtl ? "Trace right-to-left, following the letter's natural flow." : "Trace over the faint character, then try it freehand."));

  const wrap = el("div",{class:"writewrap"});
  const box = el("div",{class:"canvasbox"});
  const ghost = el("div",{class:"ghost"}, item.t);
  const canvas = el("canvas",{});
  box.appendChild(ghost); box.appendChild(canvas);
  wrap.appendChild(box);
  wrap.appendChild(el("div",{class:"writemeta"},
    el("div",{class:"lbl"}, item.t),
    el("div",{class:"name"}, item.name || "")
  ));
  const controls = el("div",{class:"row"},
    el("button",{class:"btn", onclick:()=>{ setupCanvas(canvas); }}, "Clear"),
    el("button",{class:"btn primary", style:`--accent:${lang.accent}`, onclick:()=>{ s.index=(s.index+1)%s.items.length; render(); }}, "Next →"),
    el("button",{class:"speak-btn", style:`background:${lang.accent}`, onclick:()=>speak(item.t, lang.speechLang)}, "🔊")
  );
  wrap.appendChild(controls);
  wrap.appendChild(yarnTrail(s.index % s.items.length, s.items.length, lang.accent));
  root.appendChild(wrap);
  root.appendChild(el("button",{class:"btn ghost", onclick:()=>{ state.screen="mode"; render(); }}, "← Back to modes"));

  requestAnimationFrame(()=> setupCanvas(canvas));
}

function setupCanvas(canvas){
  const box = canvas.parentElement;
  const rect = box.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
  canvas.style.width = rect.width+"px"; canvas.style.height = rect.height+"px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,rect.width,rect.height);
  ctx.lineWidth = 6; ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--thread') || "#E8DCC0";
  let drawing=false, last=null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x: t.clientX-r.left, y: t.clientY-r.top};
  }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.onpointerdown = start; canvas.onpointermove = move; canvas.onpointerup = end; canvas.onpointerleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}

// ---- Screen: Culture ----
function renderCultureScreen(root){
  const lang = LANGUAGES[state.language];
  const s = state.session;
  const item = s.items[s.index];
  root.appendChild(el("h2",{}, "Culture & history"));
  root.appendChild(yarnTrail(s.index, s.items.length, lang.accent));
  root.appendChild(el("div",{class:"culturecard"},
    el("h3",{}, item.title),
    el("p",{}, item.body)
  ));
  root.appendChild(el("div",{class:"row", style:"justify-content:center;margin-top:16px;"},
    el("button",{class:"btn", disabled: s.index===0, onclick:()=>{ s.index--; render(); }}, "← Prev"),
    el("button",{class:"btn primary", style:`--accent:${lang.accent}`, disabled: s.index>=s.items.length-1, onclick:()=>{ s.index++; render(); }}, "Next →")
  ));
  root.appendChild(el("hr",{class:"stitch"}));
  root.appendChild(el("button",{class:"btn ghost", onclick:()=>{ state.screen="mode"; render(); }}, "← Back to modes"));
}

// ---- Screen: Scoreboard ----
function renderScoreboardScreen(root){
  root.appendChild(el("h2",{}, "Scoreboard"));
  root.appendChild(el("p",{class:"subtitle"}, "Every player's tally, across all languages played."));
  const table = el("table",{class:"scores"});
  const langKeys = Object.values(LANGUAGES).filter(l=>l.available).map(l=>l);
  const thead = el("tr",{}, el("th",{},"Player"), ...langKeys.map(l=>el("th",{}, l.flag+" "+l.name)));
  table.appendChild(thead);
  state.group.forEach(p=>{
    const row = el("tr",{}, el("td",{}, p.name));
    langKeys.forEach(l=>{
      const rec = (state.scores[p.id]||{})[l.key];
      row.appendChild(el("td",{}, rec ? `${rec.correct}/${rec.total}` : "—"));
    });
    table.appendChild(row);
  });
  root.appendChild(table);
  root.appendChild(el("button",{class:"btn ghost", onclick:()=>{ state.screen="mode"; render(); }}, "← Back to modes"));
}

// ---- Boot ----
(async function boot(){
  app.appendChild(el("div",{class:"screen"}, el("h2",{},"Waking the dingo… 🐾")));
  await ensurePlayersLoaded();
  state.screen = "players";
  render();
})();
</script>
</body>
</html>
