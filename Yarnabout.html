<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yarnabout — Learn a Language, Have a Yarn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@500;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#171923;
    --bg-elev:#1F2333;
    --bg-elev-2:#272C40;
    --text:#F3EDE0;
    --text-dim:#A9A6B0;
    --thread:#E8DCC0;
    --mandarin:#E14848;
    --spanish:#F0A93C;
    --arabic:#2FB6A6;
    --maori:#6FBF73;
    --yolngu:#C97A3D;
    --good:#5FD97E;
    --bad:#F0665C;
    --radius:18px;
    --radius-sm:12px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 15% 0%, rgba(232,220,192,0.05), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(47,182,166,0.06), transparent 45%),
      var(--bg);
  }
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  #app{max-width:1400px;margin:0 auto;padding: clamp(16px, 3vw, 40px);min-height:100dvh;display:flex;flex-direction:column;}

  /* ---- Yarn thread signature element ---- */
  .yarn-trail{width:100%;overflow:visible;display:block;margin: 8px 0 24px;}
  .yarn-dot{transition:r .3s ease, fill .3s ease;}
  .stitch{border:none;border-top:3px dashed rgba(232,220,192,0.25);margin:20px 0;}

  /* ---- Header ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .yarnball{font-size: clamp(28px,4vw,40px);}
  .brand h1{font-size: clamp(26px, 4vw, 44px); margin:0; letter-spacing:.5px;}
  .brand small{color:var(--text-dim); display:block; font-size:.85em; font-weight:500;}
  .playerchip{display:flex;align-items:center;gap:8px;background:var(--bg-elev);border:1px solid rgba(255,255,255,0.06);padding:8px 14px;border-radius:999px;font-weight:600;font-size:clamp(13px,1.4vw,16px);}
  .playerchip .dot{width:10px;height:10px;border-radius:50%;background:var(--thread);}

  /* ---- Screens ---- */
  .screen{flex:1;display:flex;flex-direction:column;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .subtitle{color:var(--text-dim);font-size:clamp(14px,1.6vw,18px);margin: 0 0 24px;max-width:60ch;}

  /* ---- Cards / grids ---- */
  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
  .card{
    background:var(--bg-elev);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:10px;
    position:relative;overflow:hidden;
    transition:transform .18s ease, border-color .18s ease;
  }
  .card.clickable{cursor:pointer;}
  .card.clickable:hover, .card.clickable:focus-visible{transform:translateY(-4px);border-color: var(--accent, var(--thread));outline:none;}
  .card .icon{font-size:clamp(30px,3.4vw,40px);}
  .card h3{margin:0;font-size:clamp(18px,2vw,24px);}
  .card p{margin:0;color:var(--text-dim);font-size:clamp(13px,1.4vw,15px);}
  .card .bar{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent, var(--thread));}
  .card.locked{opacity:.45;filter:grayscale(.4);cursor:not-allowed;}
  .badge{align-self:flex-start;font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,0.08);padding:3px 9px;border-radius:999px;color:var(--text-dim);}

  /* ---- Buttons ---- */
  .btn{
    border:none;border-radius:999px;padding: 12px 24px;font-weight:700;font-size:clamp(14px,1.6vw,17px);
    background:var(--bg-elev-2);color:var(--text);border:1px solid rgba(255,255,255,0.08);
    transition:transform .12s ease, background .12s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:linear-gradient(135deg, var(--accent,var(--thread)), color-mix(in srgb, var(--accent,var(--thread)) 70%, white));color:#171923;}
  .btn.ghost{background:transparent;}
  .btn.big{padding:18px 30px;font-size:clamp(16px,2vw,20px);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .row.between{justify-content:space-between;}
  .spacer{flex:1;}

  input[type=text]{
    background:var(--bg-elev-2);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius-sm);
    padding:12px 16px;color:var(--text);font-size:16px;width:100%;
  }
  input[type=text]:focus{outline:2px solid var(--thread);}

  /* ---- Flashcards ---- */
  .stage{display:flex;flex-direction:column;align-items:center;gap:22px;flex:1;justify-content:center;padding: 10px 0 30px;}
  .progressline{width:min(680px,90%);height:8px;background:var(--bg-elev-2);border-radius:999px;overflow:hidden;}
  .progressline > div{height:100%;background:var(--accent,var(--thread));transition:width .3s ease;}
  .flashcard{
    width:min(680px,94%);
    background:var(--bg-elev);border:1px solid rgba(255,255,255,0.08);border-radius:24px;
    padding: clamp(28px,5vw,56px) clamp(20px,5vw,50px);text-align:center;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:16px;align-items:center;
  }
  .target-word{font-family:'Noto Sans SC','Noto Sans Arabic','Baloo 2',sans-serif;font-size:clamp(40px,8vw,84px);font-weight:700;line-height:1.1;}
  .target-word.rtl{direction:rtl;}
  .translit{color:var(--text-dim);font-size:clamp(14px,2vw,20px);letter-spacing:.03em;}
  .speak-btn{background:var(--accent,var(--thread));color:#171923;border:none;width:52px;height:52px;border-radius:50%;font-size:22px;box-shadow:var(--shadow);}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(680px,94%);}
  @media (max-width:520px){.choices{grid-template-columns:1fr;}}
  .choice{
    background:var(--bg-elev-2);border:2px solid rgba(255,255,255,0.08);border-radius:var(--radius-sm);
    padding:16px;font-size:clamp(15px,1.8vw,18px);font-weight:600;color:var(--text);text-align:left;
  }
  .choice:hover{border-color:var(--accent,var(--thread));}
  .choice.correct{background:rgba(95,217,126,0.18);border-color:var(--good);}
  .choice.wrong{background:rgba(240,102,92,0.18);border-color:var(--bad);}
  .feedback{min-height:28px;font-weight:700;font-size:clamp(15px,2vw,19px);}
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}

  /* ---- Phrases list ---- */
  .phraselist{display:flex;flex-direction:column;gap:12px;}
  .phrase{background:var(--bg-elev);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);padding:16px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .phrase .ptext{font-family:'Noto Sans SC','Noto Sans Arabic','Baloo 2',sans-serif;font-size:clamp(18px,2.2vw,26px);font-weight:600;}
  .phrase .ptext.rtl{direction:rtl;}
  .phrase .ptranslit{color:var(--text-dim);font-size:.9em;}
  .phrase .pen{margin-left:auto;color:var(--text-dim);font-style:italic;}

  /* ---- Writing practice ---- */
  .writewrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .canvasbox{position:relative;width:min(360px,80vw);height:min(360px,80vw);background:var(--bg-elev);border:2px solid rgba(255,255,255,0.1);border-radius:var(--radius);box-shadow:var(--shadow);}
  .canvasbox .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(260px,60vw);font-family:'Noto Sans SC','Noto Sans Arabic',sans-serif;color:rgba(255,255,255,0.08);user-select:none;pointer-events:none;}
  .canvasbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .writemeta{text-align:center;}
  .writemeta .lbl{font-size:clamp(28px,4vw,40px);font-weight:700;font-family:'Noto Sans SC','Noto Sans Arabic',sans-serif;}
  .writemeta .name{color:var(--text-dim);}

  /* ---- Culture ---- */
  .culturecard{background:var(--bg-elev);border-radius:var(--radius);padding:30px;max-width:680px;margin:0 auto;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,0.06);}
  .culturecard h3{margin-top:0;}

  /* ---- Scoreboard ---- */
  table.scores{width:100%;border-collapse:collapse;}
  table.scores th, table.scores td{text-align:left;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.06);}
  table.scores th{color:var(--text-dim);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;}

  footer.hint{margin-top:auto;padding-top:24px;color:var(--text-dim);font-size:12px;text-align:center;}

  /* ---- TV / big-screen mode: scale everything up on wide, high-res displays ---- */
  @media (min-width: 1600px){
    body{font-size:19px;}
    .btn{padding:18px 32px;}
  }
</style>
</head>

// ---- Persistence helpers ----
function loadLocal(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function saveLocal(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

async function ensurePlayersLoaded(){
  state.group = loadLocal("yarnabout_group", []);
  state.scores = loadLocal("yarnabout_scores", {});
  if(sb){
    try{
      const {data, error} = await sb.from('yarnabout_players').select('*').order('created_at');
      if(!error && data && data.length){
        state.group = data.map(r=>({id:r.id, name:r.name}));
        saveLocal("yarnabout_group", state.group);
      }
      const {data: scoreRows} = await sb.from('yarnabout_scores').select('*');
      if(scoreRows){
        const merged = {};
        scoreRows.forEach(r=>{
          merged[r.player_id] = merged[r.player_id] || {};
          merged[r.player_id][r.language] = {correct:r.correct, total:r.total};
        });
        state.scores = merged;
        saveLocal("yarnabout_scores", state.scores);
      }
    }catch(e){ console.warn("Supabase load failed, using local data", e); }
  }
}

async function addPlayer(name){
  const id = "p_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
  const player = {id, name};
  state.group.push(player);
  saveLocal("yarnabout_group", state.group);
  if(sb){
    try{ await sb.from('yarnabout_players').insert({id, name}); }catch(e){ console.warn("Supabase insert player failed", e); }
  }
  return player;
}

async function recordResult(playerId, langKey, gotCorrect){
  state.scores[playerId] = state.scores[playerId] || {};
  const cur = state.scores[playerId][langKey] || {correct:0,total:0};
  cur.total += 1;
  if(gotCorrect) cur.correct += 1;
  state.scores[playerId][langKey] = cur;
  saveLocal("yarnabout_scores", state.scores);
  if(sb){
    try{
      await sb.from('yarnabout_scores').upsert({
        player_id:playerId, language:langKey, correct:cur.correct, total:cur.total, updated_at:new Date().toISOString()
      }, {onConflict:'player_id,language'});
    }catch(e){ console.warn("Supabase score sync failed", e); }
  }
}

// ---- Speech ----
function speak(text, langCode){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = langCode;
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){ console.warn("TTS not available", e); }
}

// ---- Utility ----
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickN(arr, n){ return shuffle(arr).slice(0,n); }
function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else if(k.startsWith("on") && typeof v==="function") e.addEventListener(k.slice(2), v);
    else if(v!==undefined && v!==null) e.setAttribute(k,v);
  }
  children.flat().forEach(c=>{ if(c===null||c===undefined) return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}

function yarnTrail(activeIndex, total, accent){
  const w = 320, h = 30, gap = w/(total+1);
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("class","yarn-trail");
  svg.style.maxWidth = "360px";
  let d = `M ${gap} ${h/2} `;
  for(let i=1;i<total;i++){
    const x = gap*(i+1);
    const yOff = (i%2===0)? -8 : 8;
    d += `Q ${gap*i+gap/2} ${h/2+yOff} ${x} ${h/2} `;
  }
  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d", d);
  path.setAttribute("stroke","rgba(232,220,192,0.3)");
  path.setAttribute("stroke-width","2");
  path.setAttribute("stroke-dasharray","1 7");
  path.setAttribute("fill","none");
  svg.appendChild(path);
  for(let i=0;i<total;i++){
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx", gap*(i+1)); c.setAttribute("cy", h/2);
    c.setAttribute("r", i<=activeIndex ? 7 : 5);
    c.setAttribute("class","yarn-dot");
    c.setAttribute("fill", i<=activeIndex ? accent : "rgba(255,255,255,0.15)");
    svg.appendChild(c);
  }
  return svg;
}

}

function startMode(mode){
  const lang = LANGUAGES[state.language];
  if(mode==="flashcards"){
    state.session = {items: pickN(lang.words, Math.min(10, lang.words.length)), index:0, correct:0, total:0};
  } else if(mode==="phrases"){
    state.session = {items: lang.phrases, index:0, correct:0, total:0, revealed:{}};
  } else if(mode==="writing"){
    state.session = {items: lang.writing, index:0};
  } else if(mode==="culture"){
    state.session = {items: lang.culture, index:0};
  }
}

// ---- Screen: Flashcards ----
function renderFlashcardsScreen(root){
  const lang = LANGUAGES[state.language];
  const s = state.session;
  if(s.index >= s.items.length){
    root.appendChild(roundComplete(lang, s));
    return;
  }
  const item = s.items[s.index];
  root.appendChild(yarnTrail(s.index, s.items.length, lang.accent));
  const stage = el("div",{class:"stage"});
  const prog = el("div",{class:"progressline"}, el("div",{style:`width:${(s.index/s.items.length)*100}%; background:${lang.accent}`}));
  stage.appendChild(prog);

  const card = el("div",{class:"flashcard"},
    el("div",{class:"target-word" + (lang.rtl?" rtl":"")}, item.t),
    lang.script ? el("div",{class:"translit"}, item.p) : null,
    el("button",{class:"speak-btn", style:`background:${lang.accent}`, onclick:()=>speak(item.t, lang.speechLang)}, "🔊")
  );
  stage.appendChild(card);

  const correctEn = item.en;
  const distractors = pickN(lang.words.filter(w=>w.en!==correctEn).map(w=>w.en), 3);
  const options = shuffle([correctEn, ...distractors]);
  const choicesWrap = el("div",{class:"choices"});
  const feedback = el("div",{class:"feedback"});

  options.forEach(opt=>{
    const btn = el("button",{class:"choice", onclick:()=>{
      const isCorrect = opt===correctEn;
      Array.from(choicesWrap.children).forEach(c=>c.disabled=true);
      btn.classList.add(isCorrect?"correct":"wrong");
      if(!isCorrect){
        Array.from(choicesWrap.children).find(c=>c.textContent===correctEn)?.classList.add("correct");
      }
      feedback.textContent = isCorrect ? "Nice one! 🎉" : `Close — it means "${correctEn}"`;
      feedback.className = "feedback " + (isCorrect?"good":"bad");
      s.total++; if(isCorrect) s.correct++;
      if(state.activePlayer) recordResult(state.activePlayer.id, lang.key, isCorrect);
      setTimeout(()=>{ s.index++; render(); }, 1100);
    }}, opt);
    choicesWrap.appendChild(btn);
  });
  stage.appendChild(choicesWrap);
  stage.appendChild(feedback);
  root.appendChild(stage);
}

  const wrap = el("div",{class:"stage"});
  wrap.appendChild(el("div",{class:"flashcard"},

      el("button",{class:"btn primary", style:`--accent:${lang.accent}`, onclick:()=>{ startMode("flashcards"); render(); }}, "Play again"),
      el("button",{class:"btn ghost", onclick:()=>{ state.screen="mode"; render(); }}, "Change mode")
    )

  return wrap;
}

function setupCanvas(canvas){
  const box = canvas.parentElement;
  const rect = box.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
  canvas.style.width = rect.width+"px"; canvas.style.height = rect.height+"px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,rect.width,rect.height);
  ctx.lineWidth = 6; ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--thread') || "#E8DCC0";
  let drawing=false, last=null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x: t.clientX-r.left, y: t.clientY-r.top};
  }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.onpointerdown = start; canvas.onpointermove = move; canvas.onpointerup = end; canvas.onpointerleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}

// ---- Screen: Culture ----
function renderCultureScreen(root){
  const lang = LANGUAGES[state.language];
  const s = state.session;
  const item = s.items[s.index];
  root.appendChild(el("h2",{}, "Culture & history"));
  root.appendChild(yarnTrail(s.index, s.items.length, lang.accent));
  root.appendChild(el("div",{class:"culturecard"},
    el("h3",{}, item.title),
    el("p",{}, item.body)
  ));
  root.appendChild(el("div",{class:"row", style:"justify-content:center;margin-top:16px;"},
    el("button",{class:"btn", disabled: s.index===0, onclick:()=>{ s.index--; render(); }}, "← Prev"),
    el("button",{class:"btn primary", style:`--accent:${lang.accent}`, disabled: s.index>=s.items.length-1, onclick:()=>{ s.index++; render(); }}, "Next →")
  ));
  root.appendChild(el("hr",{class:"stitch"}));
  root.appendChild(el("button",{class:"btn ghost", onclick:()=>{ state.screen="mode"; render(); }}, "← Back to modes"));
}

// ---- Screen: Scoreboard ----
function renderScoreboardScreen(root){
  root.appendChild(el("h2",{}, "Scoreboard"));
  root.appendChild(el("p",{class:"subtitle"}, "Every player's tally, across all languages played."));
  const table = el("table",{class:"scores"});
  const langKeys = Object.values(LANGUAGES).filter(l=>l.available).map(l=>l);
  const thead = el("tr",{}, el("th",{},"Player"), ...langKeys.map(l=>el("th",{}, l.flag+" "+l.name)));
  table.appendChild(thead);
  state.group.forEach(p=>{
    const row = el("tr",{}, el("td",{}, p.name));
    langKeys.forEach(l=>{
      const rec = (state.scores[p.id]||{})[l.key];
      row.appendChild(el("td",{}, rec ? `${rec.correct}/${rec.total}` : "—"));
    });
    table.appendChild(row);
  });
  root.appendChild(table);
  root.appendChild(el("button",{class:"btn ghost", onclick:()=>{ state.screen="mode"; render(); }}, "← Back to modes"));
}

// ---- Boot ----
(async function boot(){
  app.appendChild(el("div",{class:"screen"}, el("h2",{},"Winding the yarn ball… 🧶")));
  await ensurePlayersLoaded();
  state.screen = "players";
  render();
})();
</script>
